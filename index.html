<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F5C4D">
<title>Орієнтир</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📍</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  html, body, #map { height: 100%; margin: 0; }
  body { font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .chip, .locate, .note { position: fixed; z-index: 1100; color: #fff; }
  .chip { top: calc(12px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
          padding: 8px 18px; border-radius: 24px; background: rgba(15, 92, 77, .92); font-weight: 700; }
  .locate { right: 16px; bottom: calc(28px + env(safe-area-inset-bottom, 0px)); padding: 14px 20px;
            border: 0; border-radius: 28px; background: #0F5C4D; font: inherit; font-weight: 600;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .3); }
  .note { left: 16px; right: 16px; bottom: calc(92px + env(safe-area-inset-bottom, 0px));
          padding: 10px 14px; border-radius: 12px; background: #222; display: none; }
</style>
</head>
<body>
<div id="map"></div>
<div class="chip">Орієнтир</div>
<div class="note" id="note"></div>
<button class="locate" id="locate">Показати, де я</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
  const map = L.map('map').setView([49.0, 31.0], 6); // огляд України, доки немає сигналу
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map);

  const noteEl = document.getElementById('note');
  let noteTimer;
  function note(text) {
    noteEl.textContent = text;
    noteEl.style.display = 'block';
    clearTimeout(noteTimer);
    noteTimer = setTimeout(() => (noteEl.style.display = 'none'), 5000);
  }

  let me, ring, last, first = true;
  map.on('locationfound', e => {
    last = e.latlng;
    if (!me) {
      ring = L.circle(last, { radius: e.accuracy, weight: 1, color: '#1a73e8', fillOpacity: 0.12 }).addTo(map);
